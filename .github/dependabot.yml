# Dependabot version updates.
# Opens PRs that bump dependencies on a schedule. Each PR runs through
# the lockfile-guard workflow, so yarn.lock / package.json stay in sync
# and no npm lockfile can sneak in. Security alerts are separate and
# always open regardless of this schedule.
version: 2
updates:
  # JavaScript deps. Dependabot's "npm" ecosystem understands yarn.lock
  # and respects the `resolutions` field in package.json.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Collapse routine bumps into a few PRs instead of one per package.
    groups:
      next:
        patterns:
          - "next"
          - "@next/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-and-build:
        dependency-type: "development"
      production:
        dependency-type: "production"
        exclude-patterns:
          - "next"
          - "@next/*"
          - "react"
          - "react-dom"
    # Hold back two major upgrades that need a deliberate migration, not an
    # auto-bump (both were build-tested and break `next build` as-is):
    #  - tailwindcss 4.x: CSS-first config + PostCSS plugin moved to
    #    @tailwindcss/postcss; needs a config/CSS rewrite.
    #  - typescript 7.x: the native compiler port isn't yet compatible with
    #    Next's build-time TypeScript integration.
    # Minor/patch bumps within the current majors still come through.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Keep the GitHub Actions used by the deploy and guard workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
